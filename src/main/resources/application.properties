spring.application.name=EchoAuthService

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JDBC URL using the Google Socket Factory
spring.datasource.url=jdbc:mysql:///${DB_NAME:echoauthdb}?cloudSqlInstance=${INSTANCE_CONNECTION_NAME:echo-tech-507218:asia-south1:echoauthservice}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&cloudSqlRefreshStrategy=lazy&ipTypes=PUBLIC



spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=MyVeryLongSecretKeyForJwtAuthentication123456789012345
jwt.expiration=86400000
