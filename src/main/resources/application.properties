spring.application.name=EchoAuthService

# Cloud SQL is configured in CloudSqlDataSourceConfig (Java Connector / socket factory).
# Required env vars: INSTANCE_CONNECTION_NAME, DB_USER, DB_PASS, DB_NAME
# Local MySQL without Cloud SQL: --spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=MyVeryLongSecretKeyForJwtAuthentication123456789012345
jwt.expiration=86400000
