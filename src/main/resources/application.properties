spring.application.name=EchoAuthService

# Cloud SQL (set on Cloud Run): DB_USER, DB_PASS, DB_NAME, INSTANCE_CONNECTION_NAME
# Attach the Cloud SQL instance to the Cloud Run service and grant the runtime
# service account the Cloud SQL Client role.
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JDBC URL using the Cloud SQL Java Connector socket factory
spring.datasource.url=jdbc:mysql:///${DB_NAME:echoauthdb}?cloudSqlInstance=${INSTANCE_CONNECTION_NAME:echo-tech-507218:asia-south1:echoauthservice}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&cloudSqlRefreshStrategy=lazy&ipTypes=PUBLIC

# Smaller pool suits Cloud Run's per-instance model
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1



spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=MyVeryLongSecretKeyForJwtAuthentication123456789012345
jwt.expiration=86400000
